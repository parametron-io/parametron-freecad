name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python and test suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Compile Python sources
        run: nix develop --command python -m compileall -q parametron_freecad tests

      - name: Run test suite
        run: nix develop --command python -m pytest -q
